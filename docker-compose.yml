# Local Postgres for development: docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: nursing_shifts
      POSTGRES_USER: nsc
      POSTGRES_PASSWORD: nsc
    ports:
      - "5432:5432"
    volumes:
      - nsc-data:/var/lib/postgresql/data

volumes:
  nsc-data:
